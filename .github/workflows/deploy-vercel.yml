name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Vercel project settings
        run: npx vercel@54.14.5 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: npx vercel@54.14.5 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
